# Per-extension settings for the shared test runner. See runTests.conf.dist in
# netresearch/typo3-ci-workflows for everything that can go here.

# This extension carries three PHPUnit configs. Build/phpunit.xml declares both
# suites at once and bootstraps ../vendor/autoload.php; the pair under
# Build/phpunit/ bootstraps the testing framework, and that pair is what CI runs
# (composer ci:test:php:unit / :functional). Detection would pick
# Build/phpunit.xml first, so both are pinned here until the extension keeps one
# set. Build/UnitTests.xml and Build/FunctionalTests.xml are symlinks to the
# Build/phpunit/ pair, added in January.
PHPUNIT_CONFIG="Build/phpunit/UnitTests.xml"
PHPUNIT_FUNCTIONAL_CONFIG="Build/phpunit/FunctionalTests.xml"

# composer.json aliases dev-master to 5.0.x-dev; the runner's default
# (0.1.x-dev) would resolve the extension against itself as a 0.x release.
COMPOSER_ROOT_VERSION="5.0.x-dev"

# Build/php-cs-fixer.php is what composer ci:test:php:cgl passes and therefore
# what CI enforces; .php-cs-fixer.dist.php in the root (which php-cs-fixer
# would discover on its own) only delegates to it. The pin names the CI config
# directly.
CGL_CONFIG="Build/php-cs-fixer.php"
