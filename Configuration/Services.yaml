services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Netresearch\Contexts\:
        resource: '../Classes/*'
        exclude:
            - '../Classes/Domain/Model/*'

    # Event listeners are registered exclusively via #[AsEventListener]
    # attributes on the listener classes (TYPO3 v13+). Duplicating them here
    # was only needed for TYPO3 v12, which is no longer supported.

    # Services that need to be public for TYPO3's service locator
    Netresearch\Contexts\Service\DataHandlerService:
        public: true

    Netresearch\Contexts\Service\PageService:
        public: true

    Netresearch\Contexts\Service\IconService:
        public: true

    Netresearch\Contexts\Service\FrontendControllerService:
        public: true
